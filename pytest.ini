[pytest]
# O-20 LAYER 0 (2026-10-21): a bare `pytest -q` from the repo root used to
# collect stray debug copies in `_to_delete/`, which run the session simulator
# with no seal and appended 170 synthetic rows to logs/observation/fills.jsonl
# every suite run. Scope collection to the real suite; conftest.py at the repo
# root refuses the write outright for the case where a path is named directly.
# `analysis/squeeze_buyzone/tests` is listed DELIBERATELY: it holds 10
# lookahead-bias guards that a bare `testpaths = tests` would have silently
# dropped from the suite. They also live outside tests/, so until 2026-10-21
# they ran with no O-20 seal either — the root conftest now covers them.
testpaths = tests analysis/squeeze_buyzone/tests
markers =
    fidelity: real-ledger fidelity regressions replayed from the recorded RVOL-RANK evidence (read-only; ~35s; deselect with -m "not fidelity")
