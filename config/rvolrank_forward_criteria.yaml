  paper_execution_lane: "RVOL-EXEC (separate process, separate stock client, own ledger logs/observation/rvol_exec_paper.jsonl, PAPER ONLY) measures the EXECUTION GAP vs selection_causal_first10 on the same names/days; its own criteria file follows in A2b after the 2026-09-14 delay probe"
  a2b_pending: "adverse-regime extension rule; exec-window pin from the delay probe; RVOL-EXEC criteria"

