# RVOL-RANK VIRTUAL SLEEVE — FORWARD ACCEPTANCE CRITERIA
# Drafted + FROZEN 2026-07-18 (user directive: observation-mode sleeves for
# discovery candidates; sleeve authorized in-session 2026-07-18 morning).
# NO in-place edits — dated amendment blocks only. Evidence starts at
# window_start; nothing before it counts.
#
# WHAT IS BEING TESTED (K17 as rescoped 2026-07-18 + K18 construction):
# the RELATIVE opening-RVOL ranking signal, forward, on coverage-clean data.
# Nightly job (scripts/rvolrank_sleeve.py, launchd 21:30 PT weekdays) takes
# the day's rvolshadow top-20, pulls that day's 5m bars FRESH from Polygon
# (no bars5m-store anchoring — K20 does not apply by construction), replays
# the FROZEN K18 construction (rank-priority allocation, 20% ATR(14) stop,
# no partial banking, 09:35-10:25 trigger window, 15:55 close-out), with the
# closed study's cost model verbatim (5bps slippage, $0.005/share/side,
# 1%-of-opening-volume participation cap, 10%-of-stop cancel guardrail).
# A CONTROL lane runs identically each night on the day's top-20 by dollar
# liquidity (same fresh pulls, same construction) — the coverage-clean
# selection-vs-control comparison K17's store could not provide.
# This is an after-the-fact daily simulation, NOT live execution: features
# and fills use data unavailable before the close, computed nightly under
# frozen rules. Stamped UNVALIDATED — PAPER ONLY in every output.

window_start: "2026-07-20T00:00:00-07:00"     # first sim day = Mon 07-20
ledger: "logs/observation/rvolrank_sleeve.jsonl"

acceptance:                    # ALL must hold at evaluation; no peeking gates
  min_sim_sessions: 60
  adverse_regime_required: true    # >=1 session week containing SPY <= -2%
                                   # day or VIX close > 25
  selection_mean_R_min: 0.0        # selection lane positive in its own right
  selection_t_min: 2.0
  selection_vs_control_gap_min: 0.10   # per-trade mean R gap (audit: ~0.19)
  worst_month_mean_R_min: -0.25
  min_trades_selection: 400

reporting:
  nightly: trades per lane, pull failures (silent drops forbidden),
    cumulative lane means, gap, regime tags
  cadence: nightly line in ops checks + weekly summary

# ══════════════════════════════════════════════════════════════════════
# AMENDMENT A1 — 2026-07-23 (design fixes at 5% completion, BEFORE results;
# dated-amendment block, no in-place edits to the original above).
# ══════════════════════════════════════════════════════════════════════
amendment_a1_2026_07_23:

  # ITEM 1 — EXECUTABILITY FORK. Stock data is NOT real-time: IBKR stock API
  # is NOT entitled (2026-07-22 probe: real-time OPRA options + futures only;
  # stock API needs Network A/B/C subs we do not hold), and Polygon is
  # 15-min delayed at source (rvol_shadow_scan.py). The 09:35 idealized lane
  # requires real-time stock data we lack. Therefore:
  gate_primary_lane: selection_exec        # 09:45 executable lane
  control_primary_lane: control_exec       # 09:45 executable control
  idealized_0935_lane: measurement_only    # delay-cost, NOT gate-eligible
  realtime_stock_data_dependency: REQUIRED_FOR_09_35_LANE_AND_ABSENT
  executable_entry_window: "09:45-10:25"   # skips 09:35-09:44 delayed triggers
  note: exec lanes accrue from 2026-07-23 forward; the 3 historical sessions
        are 09:35-only (idealized) and count as delay-cost measurement, not
        toward the executable gate.

  # ITEM 2 — MULTIPLICITY / DEFLATION (docs/rvolrank_trial_registry.md).
  deflation:
    trial_count_N: 27                      # enumerated lower bound; re-freeze UP if more
    method: "Bonferroni FWER 0.05 one-sided over N trials"
    dsr_expected_max_t_under_null: 2.03    # raw t=2.0 == best-of-noise
    selection_t_min_DEFLATED: 2.9          # SUPERSEDES original selection_t_min: 2.0
    rule: gates evaluate the executable selection lane against t >= 2.9

  # ITEM 6 — LEDGER hygiene.
  excluded_from_gates:
    - "2026-07-15"     # pre-window catch-up replays; window_start = 2026-07-20
    - "2026-07-16"
    - "2026-07-17"

  # ITEMS 3-5 (queued this session, measurement-only, no gate change):
  #   3 cost stress tiers (base/2x/3x) + per-trade spread proxy
  #   4 earnings/gap/halt tagging from Sharadar
  #   5 market-cap + ADV join into the nightly scan

  # ADDITION A (2026-07-23) — PRE-REGISTERED OUTCOME MATRIX at session 60.
  # Evaluated: executable(09:45) selection lane vs deflated bar t>=2.9 AND
  # gap>=0.10; "idealized" = the 09:35 lane on the same criteria. No other
  # interpretations admissible.
  outcome_matrix:
    both_fail:            "KILL the sleeve."
    both_pass:            "DEPLOY the executable spec."
    idealized_pass_exec_fail:
      label: "edge is INSIDE THE DELAY"
      decision: "real-time stock data purchase — viable ONLY with sizing-up.
                 Compute breakeven: monthly RT-data cost vs (edge R x realistic
                 capacity) using item-5 cap/ADV data. Deploy only if breakeven
                 clears with margin."
    exec_pass_idealized_fail:
      label: "accept the executable spec"
      decision: "ACCEPT exec spec AFTER a regime-luck audit (does the exec
                 edge survive removal of the best regime week / top-2 sessions)."

  # ADDITION B (2026-07-23) — BINDING CONSTRAINT.
  binding_constraint:
    hard_min_exec_selection_trades: 400   # never relaxed
    sessions_extend_to_meet_count: true   # min_sim_sessions is a floor, not a cap
    nightly_report_required: [trades_per_session_run_rate, projected_sessions_to_400]

  # ITEM 3 (2026-07-23) — COST STRESS TIERS (frozen). Gate must PASS at 'stress_2x'.
  cost_tiers:
    base:     {slippage_bps: 5,  per_share_side: 0.005}   # the frozen study model
    stress_2x: {slippage_bps: 10, per_share_side: 0.010}   # gate-binding tier
    stress_3x: {slippage_bps: 15, per_share_side: 0.015}   # reported, not binding
    gate_binding_tier: stress_2x
    per_trade_spread_proxy: "fill-bar high-low (NBBO if available) — nightly record"

