# SCALP-v3 forward-test criteria — FROZEN at activation (2026-09-25T15:19:27-07:00, operator: "run v3").
# Pre-registration: docs/scalp_v3_prereg.md. From here the only permitted edits
# are dated amendment blocks appended above this line; any change to entry /
# fill / exit / sizing rules RESETS window_start. PASS opens a discussion only —
# never auto-promote, never live.
scalp_v3_forward:
  status: FROZEN
  window_start: "2026-09-25T15:19:27-07:00"
  scoring: market_mid_v1            # ThetaData NBBO mid (subscription lapsed 09-16:
                                    # trades accrue now; enrichment backfills once
                                    # the ruler is restored — until then they are
                                    # excluded as pending_enrichment, never guessed)
  supersedes: scalp_v2_forward_criteria.yaml   # v2 window closed at this timestamp

  hypothesis: >
    Index-ETF (SPY/QQQ/IWM) 0DTE single-leg entries, 09:35-11:30 ET, volume
    ratio >= 0.8, sent as IOC at the natural, earn truth P&L per trade above
    their real round-trip cost — i.e. the sandbox-era decision-time edge is
    capturable when crossing costs ~a penny.
  falsified_if: >
    truth P&L/trade after costs <= 0 after the sample below, OR the futility
    stop trips, OR the top-2-removal check fails, OR IOC fill rate < 60%.

  rules_frozen:
    universe: [SPY, QQQ, IWM]
    structures: [0dte_directional]  # single-leg only; no debit spreads, no fallback
    entry_window_et: ["09:35", "11:30"]
    min_volume_ratio: 0.8
    fill_mode: marketable_ioc
    aggressiveness: 0.5             # inherited from scalp_v2 (the natural)
    min_net_debit: 1.00             # inherited
    max_per_day: 10                 # inherited (note: unfilled IOCs count here — known defect)
    max_attempts_per_day: 30        # inherited
    max_open: 7                     # inherited
    direction_signal: ema_stack_15m # unchanged; 5m frame shadow-logged only
    exit_rules: unchanged_from_v2
    sizing: unchanged_from_v2

  scope:
    ledger: logs/observation/fills.jsonl
    rec_id_tag: "-SCALP-"
    fill_mode: marketable_ioc       # ONLY entries filled under v3's mode count
    claude_approved_only: false
    include_fallback: false

  cost_model:
    # declared before data: ~$0.01 spread -> $1.00/contract round trip at the
    # natural, + ~$0.65 x 2 commissions. Replace with MEASURED cost only via a
    # dated amendment.
    per_contract_round_trip_usd: 2.30

  futility_stop:
    at_trades: 40
    min_truth_per_trade_usd: -10    # after costs; trips -> window closes FAIL

  min_trades: 100
  min_trading_days: 60
  adverse_regime_required: true
  min_fill_rate: 0.60
  min_forward_sharpe_ann: 0.8
  min_profit_factor: 1.3
  max_drawdown_usd: 700
  per_structure_non_negative: true
  concentration_check: true
  no_mid_stream_rule_changes: true

# ---- AMENDMENT 2026-09-27 (before the first in-window session; no fill has
# occurred, so this changes nothing already measured — the 2026-09-13 precedent) ----
amendment_2026_09_27:
  what: >
    EXIT RULE ADDED for every lane: a position that EXPIRES TODAY is closed from
    15:30 ET (risk.paper_exits.same_day_expiry_flat_et), ahead of the 15:45
    flatten. Every v3 trade is 0DTE, so every v3 trade now flattens at 15:30 if
    still open. rules_frozen.exit_rules reads "unchanged_from_v2" + this block.
  why: >
    C-9.3, operator-approved 2026-09-26. On 09-23 an outage at the 15:45 flatten
    let an NVDA call spread expire between its strikes and exercise into 400
    shares the options-only engine cannot see. 15:30 buys three retry cycles —
    it is not immunity: a dead connection at 15:30 is as dead as at 15:45.
  window_start: "unchanged — zero in-window fills existed at the time of this amendment"
  operator_confirmation: GIVEN 2026-09-26 ("Go for it" on C-9)
