# ---------------------------------------------------------------------------
# AMENDMENT 2026-07-15 — MARKET-TRUTH SCORING (user-approved in-session).
# The T2a fill-integrity audit (analysis/fill_integrity_audit_20260715.md)
# measured systematic sandbox fill flattery on both streams (funnel booked
# −$91 vs −$566 at market mids). A gate that scores the simulator's own
# fills adjudicates simulator generosity, not strategy merit (lesson L21).
# CHANGE: qualifying trades are scored by market-truth P&L (true_pnl_mid
# from logs/observation/enriched_trades_v1.jsonl — minute-NBBO mids for the
# exact contracts; a declared UPPER BOUND on real execution, superseded by
# real fill reports after the IBKR migration). Booked P&L stays a reported
# diagnostic. Trades not yet enriched are EXCLUDED pending enrichment
# (fail-closed, counted); status no_market_data excludes permanently.
# Trade/setup selection is UNTOUCHED — scoring basis only.
# window_start reset (evidence basis changed): 2026-07-11T23:30 ->
# 2026-07-15T06:00 (cost: ~4 qualifying trades, preserved as history).
# ---------------------------------------------------------------------------

forward_acceptance:
  window_start: "2026-07-15T06:00:00-07:00"   # reset by 2026-07-15 amendment (was 07-11T23:30)
  scoring: market_mid_v1                       # added by 2026-07-15 amendment

  # What counts as a qualifying trade: production alpha-funnel only.
  scope:
    claude_approved_only: true      # live Claude verdict, not mock batch reviews
    exclude_execution_tests: true   # paper_test_mode / EXECUTION-TEST fills never count
    ledger: logs/observation/fills.jsonl  # post-2026-06-25 reset ledger only

  # Sample-size and regime coverage requirements (all must hold):
  min_trades: 100                   # closed round-trips in scope
  min_trading_days: 60              # calendar span of the sample, trading days
  adverse_regime_required: true     # sample must span >= 1 week where SPY drew down
                                    # >= 3% from a 20-day high OR VIX closed > 25;
                                    # a benign-tape-only sample cannot pass

  # Performance bar over the qualifying sample (all must hold):
  min_forward_sharpe_ann: 0.8       # annualized Sharpe of daily strategy P&L
  min_profit_factor: 1.3            # gross wins / gross losses
  max_drawdown_pct_of_risk_capital: 10   # peak-to-trough on cumulative P&L,
                                         # as % of allocated risk capital
  per_sleeve_non_negative: true     # every enabled strategy sleeve individually
                                    # >= 0 total P&L; one sleeve cannot hide another

  # Anti-gaming provisions:
  no_mid_stream_rule_changes: true  # any change to entry/exit/sizing rules of a
                                    # sleeve RESETS that sleeve's forward clock
  concentration_check: true         # removing the top 2 winning trades must leave
                                    # total P&L > 0 (guards single-outlier "edge")

