# FORWARD ACCEPTANCE CRITERIA — pre-committed 2026-07-01 (user decision, option (a)
# of docs/live-readiness-review-2026-07-01.md).
#
# These criteria are FROZEN. They were written before the evidence accrues;
# amending them after looking at forward results invalidates the test (see the
# ORB and base+EQGROW false passes for why). Any change requires a dated
# amendment block below, never an in-place edit.
#
# Two-stage promotion (revised Stage 6, CLAUDE.md 2026-07-01 amendment):
#   1. Backtest pass (Sharpe >= 0.8, OOS >= 0.6 & >= 0.6x IS, maxDD <= 20%,
#      MC 5th-pct >= 0.0, worst-year Sharpe >= 0.0, >= 100 trades)
#      -> promoter writes the strategy to validated_strategies.yaml and it may
#         generate observation-mode recommendations tracked for forward stats.
#   2. Forward pass (this file) -> strategy becomes eligible for LIVE
#      recommendations. Live mode (when built) MUST check both stages.

