# AMENDMENT 2026-07-11 (dated block per the no-in-place-edits rule; user
# directive: fills outside the contemporaneous bid/ask are paper-account
# dynamics and must not count as evidence).
#
# MOTIVATION: the 2026-07-10 nightly journal flagged two TEST fills as
# impossible against their own recorded quotes (NVDA entry 1.88 vs mid 4.075;
# UBER 0.50 vs 1.085) — Tradier-sandbox artifacts, +$1,627 of fantasy P&L that
# the tracker would have counted as frozen evidence.
#
# RULE (artifact_fill_filter below): a round trip is EXCLUDED from evidence
# when its entry fill lies outside [bid - tol, ask + tol] at fill detection,
# tol = max(tolerance_abs, tolerance_frac_of_mid * mid_at_fill). The tolerance
# exists because mid_at_fill is snapshotted at fill DETECTION (up to one poll
# cycle after the broker fill), so genuine quote drift of a few percent is
# expected; 25%-of-mid instant mispricing is not (the artifacts run ~50%+).
# Round trips with no entry-fill telemetry are excluded as UNVERIFIABLE
# (fail-closed). Both exclusion counts must be reported in every tracker run —
# silent drops are forbidden.
#
# WINDOW RESET: window_start moves 2026-07-09T12:18:00-07:00 ->
# 2026-07-11T23:00:00-07:00 (this amendment). Cost: 2 accrued days / 10 round
# trips discarded, of which 3 were artifacts under the new rule (NVDA +1,060,
# UBER +567, GOOGL -10 — verified by running the tracker on the old window).
# The rule is pre-registered BEFORE any evidence accrues under it.
# ---------------------------------------------------------------------------

