scalp_forward:
  status: CLOSED_FAILED    # closed 2026-09-12T22:55:27-07:00; was FROZEN 2026-07-09 (user sign-off); amended 07-11 + 07-14 + 07-15 (see blocks above)
  window_end: "2026-09-12T22:55:27-07:00"
  window_start: "2026-07-15T06:00:00-07:00"   # reset by 2026-07-15 amendment (prior: 07-14T09:30, 07-11T23:00, orig 07-09T12:18)
  scoring: market_mid_v1   # added by 2026-07-15 amendment

  artifact_fill_filter:    # added by 2026-07-11 amendment
    enabled: true
    tolerance_abs: 0.10            # $ per contract-unit price
    tolerance_frac_of_mid: 0.25    # fraction of mid_at_fill
    unverifiable_policy: exclude   # no entry telemetry -> not evidence

  scope:
    ledger: logs/observation/fills.jsonl
    rec_id_tag: "-TEST-"           # plumbing tag retained; see docs/scalp_candidate.md
    claude_approved_only: false    # DECLARED: this candidate is gate-free by design
    include_fallback: true         # the SPY/QQQ/IWM fallback leg is part of the
                                   # behavior and counts (declared drift exposure)

  # Sample-size and regime coverage (all must hold) — mirrors the funnel gate:
  min_trades: 100                  # closed round trips in scope
  min_trading_days: 60             # calendar span in trading days (regime diversity;
                                   # at ~10/day the trade count fills early — the
                                   # days+adverse requirements are the binding ones)
  adverse_regime_required: true    # >= 1 ISO week where SPY drew down >= 3% from a
                                   # 20-day high OR VIX closed > 25 (same definition
                                   # and code as the funnel gate). Non-negotiable:
                                   # the motivating record has ZERO adverse days.

  # Performance bar over the qualifying sample (all must hold):
  min_forward_sharpe_ann: 0.8      # annualized Sharpe of daily sleeve P&L
  min_profit_factor: 1.3           # gross wins / gross losses
  max_drawdown_usd: 700            # peak-to-trough on cumulative sleeve P&L.
                                   # Basis: sleeve risk capital = max_open (7) x
                                   # per-trade budget ($1,000) = $7,000; bar = 10%,
                                   # mirroring the funnel gate's construction.
  per_structure_non_negative: true # 0dte_directional, debit_spread,
                                   # premium_selling, fallback — each >= 0 total;
                                   # one structure cannot hide another
  concentration_check: true        # removing the top 2 winners must leave
                                   # total P&L > 0

  # Anti-gaming provisions (identical spirit to the funnel gate):
  no_mid_stream_rule_changes: true # any change to the sleeve's entry/exit/sizing
                                   # rules (incl. caps, z-overlay, fallback list)
                                   # RESETS window_start
  outcome: >
    PASS opens a promotion DISCUSSION only (never auto-promote, never live
    without the full two-stage discipline). FAIL retires the hypothesis and the
    sleeve reverts to pure execution instrumentation.
