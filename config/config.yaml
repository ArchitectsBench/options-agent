  # second 15 selected empirically 2026-06-12 via scripts/liquidity_screen.py
  # (live near-ATM spreads vs our own $0.20/OI-500 filters; most semis FAILED
  # the absolute cap — only SMCI/PLTR/INTC qualified)
  default: [AAPL, MSFT, NVDA, AMZN, TSLA, META, AMD, GOOGL, SPY, QQQ, NFLX, JPM, XOM, COST, CRM,
            PYPL, MARA, SMCI, XLE, XLF, PLTR, BAC, UBER, WMT, HOOD, TLT, SLV, IWM, BABA, INTC]
