    index: [SPY, QQQ, IWM]

risk:
  broker_reconnect_in_session: true   # C-12.2 (2026-09-28): if the IBKR client is
                                # DISCONNECTED, re-attempt the connection once per cycle
                                # and reconcile before trading. The engine used to connect
                                # once at startup; a gateway that came up later was never
                                # used (09-28: 78 brokerless cycles). false = old behaviour.
  reconcile_in_loop: true       # C-9.1 (2026-09-25): each cycle, compare the book with the
                                # broker's positions and act on drift that PERSISTS two
                                # cycles (broker_lost -> flag + stop closes; same-leg quantity
                                # -> adopt broker qty; legged -> page, touch nothing). false =
                                # detect-only, as before. Kill switch for Monday if needed.
  account_size: 50000
  # dated amendment 2026-08-03 (user): lanes hold independent books; combined
  # per-underlying max-loss across BOTH lanes stays bounded by this cap
  max_book_risk_per_underlying_usd: 2000
  max_risk_per_trade_pct: 2.0
  max_open_recommendations: 3
  # L-d (2026-08-06): PER-LANE concurrency budgets. Funnel positions must never
  # consume SCALP's slots or vice versa — lanes are isolated in execution state.
  max_open_per_lane:            # PROVISIONAL, dated 2026-08-06, chosen not derived:
    funnel: 3                   # inherited from max_open_recommendations
    scalp: 7                    # inherited from paper_test_max_open
  max_recommendations_per_day: 10  # 6->10 (2026-08-03 amendment, w/ lane isolation;
                                   # thresholds/confidence/Claude-budget UNCHANGED)
  # risk kernel (2026-07-02, Phase L step 1 — enforced in the PAPER path for
  # burn-in; see src/engine/risk.py). Breaker halts NEW entries only; exits
  # always run.
  max_daily_loss_pct: 3.0       # ACCOUNT-LEVEL hard cap (-$1,500 on 50k). Two-tier
                                # breaker (L-b, 2026-08-06): a lane tripping its own
                                # limit halts THAT LANE only; this account cap halts
                                # BOTH. Account risk intentionally spans lanes.
  max_daily_loss_pct_per_lane:  # PER-LANE limits (L-b). Lane isolation in execution.
    # PROVISIONAL and CHOSEN, not derived — dated 2026-08-06, same convention as
    # entry_vwap_margin_atr. 2.0 sits under the 3.0 account cap so one lane can
    # trip alone; no evidence yet says 2.0 is the right split. Revisit once the
    # isolated-lane evaluation clock has data.
    funnel: 2.0
    scalp: 2.0
  max_contracts: 10             # absolute per-trade size ceiling (liquidity sanity)
  paper_exits:                  # deterministic exit rules for paper positions
    profit_target_pct: 0.50     # close at 50% of max profit captured
    stop_loss_pct: 0.50         # close at 50% of debit lost
    flat_time_et: "15:45"       # day-trading mandate: flat before the close
    same_day_expiry_flat_et: "15:30"  # C-9.3 (2026-09-25): anything expiring TODAY is
                                      # closed from here — an outage at 15:45 let a
                                      # spread expire into stock on 09-23. Applies to
                                      # 0DTE (every SCALP-v3 trade); see the dated
                                      # amendment in scalp_v3_forward_criteria.yaml.
    entry_timeout_min: 30       # cancel unfilled entries (signal expired)
    quote_outage_flatten_cycles: 4  # protective close after N unpriceable cycles
                                    # (~20 min; alert at 2; 0 disables) — 2026-07-02
    single_leg_target_gain_pct: 0.50  # single-leg longs: take profit at +50% of
                                      # debit (2026-07-06 — closes the no-target
                                      # gap; 0dte sleeve had 0 funnel trades)
