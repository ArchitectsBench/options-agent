agent:
  # RULE-CONSISTENCY GATE (2026-08-06). Exit closes a long at vwap_dist<0 and a
  # short at >0 with no buffer, but entry had no matching requirement — 10 of 21
  # entries on 08-06 were opened ALREADY inside the exit condition (0 winners,
  # median hold 1 cycle). Entry now requires this margin on the correct side.
  # PROVISIONAL and CHOSEN, not derived. Exit rule untouched.
  entry_vwap_margin_atr: 0.25
  # ITEM 3 (2026-08-05): a partially-filled entry is booked immediately at the
  # FILLED quantity and enters normal management; the unfilled remainder is
  # cancelled after this many seconds. No signal revalidation (out of scope).
  partial_fill_remainder_cancel_seconds: 60
  # FULL MIGRATION TO IBKR PAPER (2026-08-04, operator decision).
  # Both lanes: SCALP auto-submits, funnel stays confirmation-required.
  # Orders route to the IBKR paper gateway (127.0.0.1:4002, acct DUQ000000)
  # and fill against REAL OPRA quotes instead of Tradier sandbox fantasy
  # fills (which disagreed on P&L SIGN in 26% of 2026-08-04's trades).
  # Truth basis for scoring is UNCHANGED: ThetaData minute NBBO mids.
  # Revert = set this back to tradier_sandbox and restart.
  # RE-FLIPPED 2026-08-05 06:48 after the thread-confinement fix (b9e7094).
  # The 06:35 hang was ib_async event-loop thread affinity; the client now runs
  # on one dedicated thread with per-call timeouts, so a wedged IBKR call
  # degrades (ambiguous/None) instead of freezing the cycle. Verified against
  # the live gateway from 4 concurrent threads.
  # RE-APPLIED 2026-08-06 06:25 PT per runbook step 1 (mandatory first).
  # Engine runs on IBKR paper: real OPRA fills, no sandbox fantasy fills.
  broker: ibkr_paper
  # dated amendment 2026-08-03 (user-approved, effective immediately):
  # SCALP and funnel keep INDEPENDENT position books (per-lane
  # one-position-per-ticker); shared registry let SCALP starve the funnel
  # (08-03: HOOD x10/WMT x6 position_exists kills). Rollback: set false.
  lane_isolation: true
  cycle_minutes: 5
  market_hours: { start: "06:30", end: "13:00", tz: "America/Los_Angeles" }
  auto_start: false
  # Paper-EXECUTION test mode (sandbox only): deliberately fire the paper-order
  # path on structurally-valid (applicability=viable) setups to validate
  # fills/exits/sizing end-to-end. NOT an edge claim — orders tagged
  # EXECUTION-TEST. LIVE trading stays fully gated regardless of this flag.
  paper_test_mode: true       # re-enabled 2026-06-25 (user wants orders to keep firing)
  mode: observation           # observation | live. 'live' is gated (src/engine/live_gate.py,
                              # 2026-07-02): requires a Stage-6 validated strategy AND a
                              # forward-acceptance PASS AND live credentials AND the (unbuilt)
                              # live execution layer — the agent REFUSES to start otherwise.
  confirm_mode: false         # recommend-and-confirm drill (2026-07-02): when true,
                              # approved funnel recs are QUEUED for `trader confirm <rec_id>`
                              # instead of auto-submitted (paper). Live mode always confirms.
                              # Default off so forward-test throughput never waits on a human.
  confirm_expiry_min: 15      # unanswered confirmation asks expire after this
  watchdog_enabled: true      # streaming stop/target reflex loop (2026-07-03):
                              # ~1s exit reaction on open positions vs 5-min cycle;
                              # cycle remains the backstop if the stream degrades
  paper_test_max_open: 7      # cap concurrent test positions (kept at 7: ~$7k
                              # simultaneous max-loss is enough correlated risk)
  # ── SCALP-v2 (DRAFT 2026-09-12, operator-requested) ──────────────────────
  # Pre-registered candidate: docs/scalp_v2_prereg.md + config/scalp_v2_forward_criteria.yaml.
  # OFF by default. Flipping `enabled` is the activation act and RESETS the v2
  # window_start (write it into the criteria file the same minute). While off,
  # every v1 behaviour is byte-identical.
  scalp_v2:
    enabled: true               # ACTIVATED 2026-09-12T22:55:27-07:00 (operator: 'go ahead')
    fill_mode: marketable_day   # ACTIVATED 2026-09-16T14:01:38-07:00 (operator: option 4).
                                # limit = mid + aggressiveness*spread (SAME price as
                                # marketable_ioc) but tif=DAY; the ENGINE cancels an
                                # unfilled entry after entry_timeout_min. IBKR refuses
                                # IOC on a SMART combo (error 201), so this is the only
                                # marketable form a SPREAD can use — under IOC all 44
                                # spread entries were rejected on arrival.
                                # WINDOW RESET to this timestamp: see the 2026-09-16
                                # amendment in config/scalp_v2_forward_criteria.yaml.
                                # Pre-registered prediction is ADVERSE (-$48/trade on
                                # the replay, docs/scalp_fill_design_grid_20260916.md);
                                # the operator elected to test it on live data.
    entry_timeout_min: 5        # marketable_day only: cancel an unfilled entry here
    reattempt_cooldown_min: 30  # marketable_day only: bar the same ticker+strategy+
                                # direction this long after a cancel (churn guard)
    aggressiveness: 0.5         # 0.5 = the natural (ask for buys); 0 = mid
    min_net_debit: 1.00         # price floor: sub-$1 contracts pay ~11% of premium
                                # to cross vs ~4% above $3
    max_per_day: 10             # operator: 10 (not 4) — 2026-09-12  (FILLED entries)
    max_attempts_per_day: 30    # IOC ATTEMPTS (filled + unfilled). An unfilled IOC
                                # consumes no fill slot, so without this the engine
                                # could fire unbounded attempts on a day nothing fills
  scalp_v3:                     # FILTER LAYER on scalp_v2 (docs/scalp_v3_prereg.md)
    enabled: true               # ACTIVATED 2026-09-25T15:19:27-07:00 (operator: 'run v3').
                                # v2 stays enabled as the base (caps, $1 floor, exits,
                                # sizing); v3 narrows it. Window + gates:
                                # config/scalp_v3_forward_criteria.yaml (FROZEN).
    tickers: [SPY, QQQ, IWM]
    strategies: [0dte_directional]   # single-leg only; debit-spread fallback OFF
    entry_window_et: ["09:35", "11:30"]   # start inclusive, end exclusive
    min_volume_ratio: 0.8
    fill_mode: marketable_ioc   # single legs accept IOC (IBKR only refused combos)
    shadow_direction_frame: 5m  # recorded on each rec, never used to trade
  paper_test_max_per_day: 20  # 10->20 (2026-07-14, user): the 10-cap exhausted by
                              # ~8am PT leaving the afternoon unsampled (56-trade
                              # clean history: 3 entries ever after 08:00) — raise
                              # funds time-of-day coverage. max_open stays 7 so the
                              # sleeve risk basis (and the $700 DD bar built on it)
                              # is unchanged. Scalp window reset per the 07-14
                              # amendment in scalp_forward_criteria.yaml.
  adopt_foreign: false        # false = app IGNORES any order/position it didn't
                              # place (safe to share this sandbox account for your
                              # own manual/overnight trades). true = app manages
                              # (cancels/flattens) everything in the account.
  # 2026 NYSE full-day holidays
  holidays_2026: ["2026-01-01", "2026-01-19", "2026-02-16", "2026-04-03",
                  "2026-05-25", "2026-06-19", "2026-07-03", "2026-09-07",
                  "2026-11-26", "2026-12-25"]
  # 2026 NYSE EARLY CLOSES — date -> session end in PT (agent.market_hours.tz).
  # Source: live Tradier calendar() probe 2026-11-24 — both days carry
  # close 13:00 ET; 2026-07-03 is a FULL holiday (above), not an early close.
  # The live tick does not need this (market_open() asks the Tradier clock,
  # which knows half-days); it exists for the half-day-BLIND static fallback
  # and for scripts/ops/liveness.py, which has no exchange calendar at all.
  early_close_2026: {"2026-11-27": "10:00", "2026-12-24": "10:00"}

llm:
  local:
    provider: ollama
    # benchmarked 2026-06-10 on this M5/32GB: qwen2.5:32b = 118s warm @ 1.1 tok/s
    # (memory-bound, 4x over budget); llama3.1:8b = 8.6s warm @ 20.9 tok/s.
    # Measured numbers, not assumptions: 8b is primary. Revisit qwen via a
    # smaller quant (e.g. qwen2.5:14b) if synthesis quality disappoints.
    model: llama3.1:8b
    fallback: llama3.1:8b
    max_latency_seconds: 30
  claude:
    # CLAUDE.md pinned claude-sonnet-4-20250514, which is deprecated (retires
    # 2026-06-15). Updated to the current Opus alias per Anthropic docs.
    # 2026-09-14 (operator: "upgrade to Fable or Opus 5, best judgement"):
    # claude-opus-5 — drop-in successor to 4.8 at the SAME price ($5/$25 per
    # MTok), adaptive thinking (the call already sends it), refusal handled as
    # HELD. Fable 5.1 was NOT chosen: 2x the price ($10/$50) for a structured
    # JSON validation the Opus tier handles; Opus 5 is Anthropic's stated
    # default upgrade path. Note: the validator model is part of the funnel's
    # evidence basis — recorded in config/forward_acceptance.yaml.
    model: claude-opus-5
    # 2026-09-29 OPERATOR DECISION ("Keep everything except claude veto turning
    # off"): the validator is OFF. No Anthropic API call is made anywhere; every
    # conf >= threshold funnel candidate is HELD ("validator disabled by
    # operator"), never placed on local-only approval. The funnel lane
    # therefore books nothing while this is false; SCALP-v3 and RVOL-EXEC do
    # not use the gate and are unaffected. Also the master switch for
    # batch_reviews below. Flip to true only by operator decision (O-33).
    enabled: false
    invoke_threshold: 0.75
    max_calls_per_day: 30   # 20->30 (2026-07-02, funnel-throughput): hit 17/20
                            # on 07-01; Batches pre-screen halved unit cost, and
                            # the risk gate now runs BEFORE Claude so risk-blocked
                            # candidates no longer consume calls
    ticker_cooldown_minutes: 90
    batch_reviews:              # nightly mock reviews (Batches API, 50% cost,
      enabled: false            # separate from the live budget above)
                                # 2026-09-29: off with the validator (API spend);
                                # the 17:15 launchd job stays loaded, exits "disabled"
      max_per_night: 24
      per_group_cap: 3          # per ticker+strategy+direction+status group

