# SCALP-v2 forward-test criteria — DRAFT (2026-09-12). Not yet frozen.
#
# Becomes FROZEN the minute agent.scalp_v2.enabled is set true: write that
# timestamp into window_start below in the same commit. From then on the only
# permitted edits are dated amendment blocks appended above this line, and any
# change to entry/fill/exit/sizing rules RESETS window_start.
#
# WHY v2 EXISTS (docs/tradier_vs_ibkr_reassessment_20260912.md): all of v1's
# truth edge lived in fills that executed within 1 minute (Tradier sandbox:
# 183 such fills, +$48.8/trade). IBKR produced ZERO of them, because v1 rests a
# limit at the decision-time mid, which only executes after the market has moved
# through it. v2 tests ONE hypothesis: taking liquidity that is there NOW
# (immediate-or-cancel at the natural) captures that subset in a real market.
# Everything else (signals, exits, sizing) is held identical to v1 so the test
# isolates the fill mechanism.
# ---------------------------------------------------------------------------
# AMENDMENT 2026-09-25T15:19:27-07:00 — WINDOW CLOSED, SUPERSEDED BY SCALP-v3 (operator: "run v3").
# Not a PASS/FAIL verdict: the marketable_day window (opened 2026-09-16) is
# closed early because the operator moved the lane to the v3 candidate
# (docs/scalp_v3_prereg.md; config/scalp_v3_forward_criteria.yaml). Supporting
# research at close: fill-design grid (09-16) and exit-design grid (09-25)
# found no v2 configuration positive after costs. Evidence from inside the
# window remains the v2 record; nothing after window_end is v2 evidence.
# Only `status` and `window_end` changed below; everything else UNTOUCHED.
# ---------------------------------------------------------------------------
scalp_v2_forward:
  status: CLOSED_SUPERSEDED   # closed 2026-09-25T15:19:27-07:00 (v3); was FROZEN 2026-09-12T22:55:27-07:00 (operator sign-off: 'go ahead')
  window_end: "2026-09-25T15:19:27-07:00"
  window_start: "2026-09-16T14:01:38-07:00"   # RESET 2026-09-16 by the fill_mode change
                                          # (prior IOC window 2026-09-12T22:55:27-07:00,
                                          #  closed INVALID-mechanical — see amendment below)
  scoring: market_mid_v1            # ThetaData NBBO mid; booked fills are NEVER the ruler
  supersedes: scalp_forward_criteria.yaml   # v1 window closes at v2 activation (dated amendment there)

  hypothesis: >
    Immediate-or-cancel entries at mid + 0.5*spread, restricted to contracts
    with net debit >= $1.00 and capped at 10 entries/day, produce truth
    (NBBO-mid) P&L per trade > measured round-trip spread cost, i.e. the
    fast-fill subset's edge is real and capturable, not a sandbox artifact.
  falsified_if: >
    After the sample below, truth P&L per trade <= 0, OR the fill rate on
    IOC entries is < 25% (the subset does not exist in a real market), OR
    the concentration check fails (edge is again a handful of trades).

  rules_frozen:                     # every field here is part of the candidate
    fill_mode: marketable_day       # amended 2026-09-16 (was marketable_ioc)
    entry_timeout_min: 5            # engine cancels an unfilled entry here
    reattempt_cooldown_min: 30      # churn guard after a cancel
    aggressiveness: 0.5
    min_net_debit: 1.00
    max_per_day: 10                 # FILLED entries
    max_attempts_per_day: 30        # IOC attempts, filled + unfilled
    max_open: 7                     # unchanged from v1
    entry_signals: unchanged_from_v1
    exit_rules: unchanged_from_v1   # verified near-optimal (docs/entry_exit_research_20260831.md)
    sizing: unchanged_from_v1

  scope:
    ledger: logs/observation/fills.jsonl
    rec_id_tag: "-SCALP-"
    fill_mode: marketable_day       # ONLY entries filled under v2's mode count
    claude_approved_only: false
    include_fallback: true

  min_trades: 100
  min_trading_days: 60
  adverse_regime_required: true
  min_fill_rate: 0.25               # v2-specific: IOC must actually fill
  min_forward_sharpe_ann: 0.8
  min_profit_factor: 1.3
  max_drawdown_usd: 700
  per_structure_non_negative: true
  concentration_check: true
  no_mid_stream_rule_changes: true
  outcome: >
    PASS opens a promotion DISCUSSION only. Never auto-promote, never live.
    A clean FAIL is a complete deliverable: it retires the fast-fill hypothesis.

# ---- AMENDMENT 2026-09-13 (before the first in-window session; no fill has
# occurred, so this changes nothing already measured) ----
amendment_2026_09_13:
  what: no NEW v2 entries inside the last 15 minutes before risk.paper_exits.flat_time_et (15:45 ET) -> cutoff 15:30 ET
  why: v2 fills INSTANTLY; a 15:50-15:55 ET fill has no cycle left to be flattened and goes home unmanaged overnight. v1 rested at mid and rarely filled that late.
  exit_rules: unchanged
  operator_confirmation: PENDING (OBJECTIVES.md confirmation list)

# ---- DISCLOSURE NOTE 2026-09-15 (no criterion changed) ----
# IBKR REJECTS immediate-or-cancel on SMART-routed option combos: every v2
# debit-spread entry (43 by 09-15 09:30 PT) came back `Error 201 ... Inter
# exchange combo order should be DAY/GTC order`. The engine logs a post-time
# reject as `entry_ioc_unfilled`, so the ioc_fill_rate denominator above
# INCLUDES those 43 broker rejects: as recorded 2/46; on orders that reached
# the market (3 single legs) 2/3. The frozen computation is NOT changed here;
# reports now show both numbers. Whether v2 stops (early-stop) or is re-tested
# on a fresh window is the operator's decision — OBJECTIVES C-6,
# docs/scalp_v2_spread_rejects_20260915.md.

# ---- AMENDMENT 2026-09-16 — FILL MECHANISM CHANGED, WINDOW RESET ----
# Operator decision (option 4), taken with the evidence below in hand.
amendment_2026_09_16:
  what: >
    fill_mode marketable_ioc -> marketable_day. SAME marketable limit
    (mid + 0.5*spread); tif becomes DAY and the ENGINE cancels an unfilled
    entry after entry_timeout_min (5), with a reattempt_cooldown_min (30)
    churn guard. window_start RESET to 2026-09-16T14:01:38-07:00.
  why: >
    IBKR refuses IOC on a SMART-routed combo (error 201), so all 44 v2 debit
    spreads were rejected on arrival and the IOC window could never test the
    hypothesis on spreads at all. marketable_day is the only marketable form
    the broker accepts for a combo.
  prior_window_verdict: >
    INVALID-mechanical, NOT a FAIL. 2026-09-12T22:55:27-07:00 .. 2026-09-16T14:01:38-07:00:
    47 recorded attempts, 2 fills. 44 of those "attempts" were broker refusals
    that never reached the market; on the 3 orders that did, 2 filled. The
    fast-fill hypothesis was never given a fair test on spreads, so it is
    neither confirmed nor refuted by this window.
  revised_hypothesis: >
    A marketable limit at the natural, cancelled within 5 minutes if unfilled,
    produces truth (NBBO-mid) P&L per trade > measured round-trip spread cost.
    Signals, exits and sizing remain unchanged from v1.
  pre_registered_prediction: >
    ADVERSE. The pre-declared fill-design grid on the pre-window attempt cache
    (docs/scalp_fill_design_grid_20260916.md) scores this exact cell at
    -$48.3/trade after costs, 92% fill, median wait 0 min, with the second half
    of the sample worse than the first. Every one of its 22 cells was negative.
    This window is therefore expected to FALSIFY; it is run because the operator
    elected to test it on live data rather than on the replay alone.
  known_weakness: >
    min_fill_rate 0.25 is no longer a meaningful falsifier under this mode —
    the measured fill rate is ~92% because a limit at the natural is marketable
    on arrival. The binding criteria are truth P&L per trade, profit factor,
    drawdown and concentration. The floor is left UNCHANGED (operator's call).
  measurement_caveat: >
    ThetaData lapsed to the FREE tier on 2026-09-16 (HTTP 403 on option
    history), so scoring=market_mid_v1 CANNOT be computed while it is down;
    trades accrue as pending_enrichment. Recoverable retroactively with
    `enrich_trades_thetadata.py --redo-no-data` once the subscription is
    restored, provided the renewed plan still covers these dates.
  exit_rules: unchanged
  operator_confirmation: GIVEN 2026-09-16 ("4")
